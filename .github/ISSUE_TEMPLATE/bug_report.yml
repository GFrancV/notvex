name: Bug report
description: Something in Notvex doesn't work as it should
title: '[BUG] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. **Never paste note content, passwords, your recovery key or your `.nvx` vault file.**

        Found a security vulnerability? Don't open an issue: [report it privately](https://github.com/GFrancV/notvex/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you were doing, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Notvex version and operating system. Settings → About shows the version.
      placeholder: 'Version: 0.3.0 · OS: Windows 11'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Recent errors
      description: Notvex's local error log. It never contains note content.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no note content, passwords or recovery key.
          required: true
