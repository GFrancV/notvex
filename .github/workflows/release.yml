name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    # Same image as validate.yml: @journeyapps/sqlcipher's binding needs libssl1.1
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validations
        run: pnpm check:task

  create-release:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo GFrancV/notvex >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --repo GFrancV/notvex \
              --draft \
              --title "${{ github.ref_name }}"
          fi

  release:
    needs: [validate, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-arg: --win
          - os: macos-latest
            build-arg: --mac
          - os: ubuntu-latest
            build-arg: --linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifacts
        run: pnpm exec electron-builder ${{ matrix.build-arg }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attests the files electron-builder just uploaded; updater metadata (latest*.yml,
      # *.blockmap) is left out since users never download and run it.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
