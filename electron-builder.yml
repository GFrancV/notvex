appId: com.notvex.app
productName: Notvex
copyright: Copyright © 2026 Notvex

fileAssociations:
  - ext: nvx
    name: Notvex Vault
    description: Notvex Encrypted Vault
    mimeType: application/x-notvex-vault
    role: Editor

directories:
  output: dist-release

compression: maximum

files:
  - out/**/*
  - '!**/dxcompiler.dll'
  - '!**/dxil.dll'

asar: true
asarUnpack:
  - node_modules/@journeyapps/sqlcipher/**
  - node_modules/koffi/**

npmRebuild: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/win/icon.ico
  requestedExecutionLevel: asInvoker
  artifactName: Notvex-Setup-${version}.exe

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icons/mac/icon.icns
  category: public.app-category.productivity
  artifactName: Notvex-${version}-linux.${ext}
  notarize: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  category: Office
  artifactName: Notvex-${version}.AppImage
