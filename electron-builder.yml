appId: com.notvex.app
productName: Notvex
copyright: Copyright © 2026 Notvex

asarUnpack:
  - node_modules/@journeyapps/sqlcipher/**
  - node_modules/koffi/**

compression: maximum

fileAssociations:
  - ext: nvx
    name: Notvex Vault
    description: Notvex Encrypted Vault
    mimeType: application/x-notvex-vault

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierrc,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/dxcompiler.dll'
  - '!**/dxil.dll'
  - out/**/*

win:
  executableName: notvex
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlements: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
